name: package

# Builds the PS3 package; ci.yml runs it on every push, build.yml by hand to keep the .pkg and
# its .elf.
on:
  workflow_call:
    inputs:
      keep:
        description: "Keep the .pkg and its .elf as a workflow artifact"
        type: boolean
        default: false
      log_host:
        description: "PC address a debug build sends its log to; empty for a release build"
        type: string
        default: ""

permissions: {}

env:
  # The ps3dev SDK with its portlibs (SDL, json-c, curl on mbedTLS). It is only published as
  # nightlies, so one is pinned by its hash.
  SDK_URL: https://github.com/ps3dev/ps3dev/releases/download/nightly-2026-10-12/ps3dev-linux-X64.tar.gz
  SDK_SHA256: 76b1b3bc9ac260a4ece86da520225da7f2f4e334174e37b850093ff925eeb900
  # The SDK's SDL source, pinned, rebuilt with patches/sdl-psl1ght-flip-room.patch.
  SDL_URL: https://github.com/zeldin/SDL_PSL1GHT/archive/641a8ca2efa3f775d489daa37878ada1d92c24ab.tar.gz
  SDL_SHA256: dc4a650d4b6afe4ad8c91e2d7d302570503fcf5453d7a183377225a2b3d0f66c

jobs:
  package:
    runs-on: ubuntu-24.04
    # The SDK is built on Ubuntu 24.04, and its tools need that system's libraries.
    container: ubuntu:24.04@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: SDK tools' libraries
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          # autoconf and patch rebuild SDL in the next steps.
          apt-get install -y -qq --no-install-recommends ca-certificates curl make libelf1t64 \
            autoconf patch
      - name: PSL1GHT SDK
        run: |
          curl -fsSL "$SDK_URL" -o ps3dev.tar.gz
          echo "$SDK_SHA256  ps3dev.tar.gz" | sha256sum -c -
          tar xzf ps3dev.tar.gz -C /opt
          rm ps3dev.tar.gz
          echo "PS3DEV=/opt/ps3dev" >> "$GITHUB_ENV"
          echo "PSL1GHT=/opt/ps3dev" >> "$GITHUB_ENV"
      - name: SDL with room for flips
        shell: bash
        run: |
          curl -fsSL "$SDL_URL" -o /tmp/sdl.tar.gz
          echo "$SDL_SHA256  /tmp/sdl.tar.gz" | sha256sum -c -
          mkdir /tmp/sdl
          tar xzf /tmp/sdl.tar.gz -C /tmp/sdl --strip-components=1
          patch -d /tmp/sdl -p1 < patches/sdl-psl1ght-flip-room.patch
          cd /tmp/sdl
          export PATH="$PS3DEV/ppu/bin:$PATH"
          ./script.sh
          make -j"$(nproc)" install
      - name: Build
        env:
          LOG_HOST: ${{ inputs.log_host }}
        shell: bash
        run: |
          if [ -n "$LOG_HOST" ] && ! [[ "$LOG_HOST" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then
            echo "log_host must be an IPv4 address, got: $LOG_HOST"
            exit 1
          fi
          make pkg LOG_HOST="$LOG_HOST"
      - if: inputs.keep
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: own-storage-${{ github.sha }}${{ inputs.log_host != '' && '-debug' || '' }}
          # The .elf keeps the symbols the package's stripped binary drops, so a debugger's
          # addresses can be read as function names.
          path: |
            own-storage*.pkg
            own-storage.elf
          if-no-files-found: error
          retention-days: 14
