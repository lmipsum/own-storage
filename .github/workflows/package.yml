name: package

# Builds the PS3 package; ci.yml runs it on every push, build.yml by hand to keep the .pkg and
# its .elf.
on:
  workflow_call:
    inputs:
      keep:
        description: "Keep the .pkg and its .elf as a workflow artifact"
        type: boolean
        default: false
      log_host:
        description: "PC address a debug build sends its log to; empty for a release build"
        type: string
        default: ""

permissions: {}

env:
  # The ps3dev SDK with its portlibs (json-c, curl on mbedTLS). It is only published as
  # nightlies, so one is pinned by its hash.
  SDK_URL: https://github.com/ps3dev/ps3dev/releases/download/nightly-2026-10-12/ps3dev-linux-X64.tar.gz
  SDK_SHA256: 76b1b3bc9ac260a4ece86da520225da7f2f4e334174e37b850093ff925eeb900
  # PS3DK builds the XMB's VSH plugin: only its Windows release carries the SDK that builds modules.
  PS3DK_URL: https://github.com/FirebirdTA01/PS3DK/releases/download/v0.27.0/ps3-sdk-v0.27.0-windows-x86_64.zip
  PS3DK_SHA256: 4557df1c9535d1d1e5703c62a792ae68ba278a8d03503890827abc00ef83bc62
  PS3DK_ROOT: ps3-sdk-v0.27.0-windows-x86_64

jobs:
  plugin:
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: ps3dk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ps3dk
          key: ps3dk-${{ env.PS3DK_SHA256 }}
      - name: PS3DK
        if: steps.ps3dk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fsSL "$PS3DK_URL" -o ps3dk.zip
          echo "$PS3DK_SHA256  ps3dk.zip" | sha256sum -c -
          mkdir ps3dk
          # Windows' own tar reads zip archives.
          /c/Windows/System32/tar.exe -xf ps3dk.zip -C ps3dk
          rm ps3dk.zip
      - name: Build
        env:
          # A debug package's plugins log to the console's disk.
          PLUGIN_LOG: ${{ inputs.log_host != '' && 'ON' || 'OFF' }}
        shell: pwsh
        run: |
          python -m pip install --quiet ninja==1.13.2
          $env:PS3DK = Join-Path $PWD "ps3dk\$env:PS3DK_ROOT"
          $env:PS3DEV = $env:PS3DK.Replace('\', '/')
          $env:PSL1GHT = $env:PS3DEV
          $env:PATH = "$env:PS3DK\bin;$env:PS3DK\ppu\bin;$env:PATH"
          cmake -S plugin -B build/plugin -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="$env:PS3DK\cmake\ps3-ppu-toolchain.cmake" `
            -DOWNS_PLUGIN_LOG="$env:PLUGIN_LOG"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/plugin
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owns-plugins
          path: |
            build/plugin/owns_launcher.sprx
            build/plugin/owns_menu.sprx
            build/plugin/owns_menu.rco
          if-no-files-found: error
          retention-days: 1

  package:
    needs: plugin
    runs-on: ubuntu-24.04
    # The SDK is built on Ubuntu 24.04, and its tools need that system's libraries.
    container: ubuntu:24.04@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: SDK tools' libraries
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl make libelf1t64
      - name: PSL1GHT SDK
        run: |
          curl -fsSL "$SDK_URL" -o ps3dev.tar.gz
          echo "$SDK_SHA256  ps3dev.tar.gz" | sha256sum -c -
          tar xzf ps3dev.tar.gz -C /opt
          rm ps3dev.tar.gz
          echo "PS3DEV=/opt/ps3dev" >> "$GITHUB_ENV"
          echo "PSL1GHT=/opt/ps3dev" >> "$GITHUB_ENV"
      # The package carries the plugins: the launcher, which the app installs, and the save menu's
      # view, which the launcher loads from there.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: owns-plugins
          path: package/USRDIR/plugins
      - name: Build
        env:
          LOG_HOST: ${{ inputs.log_host }}
        shell: bash
        run: |
          if [ -n "$LOG_HOST" ] && ! [[ "$LOG_HOST" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then
            echo "log_host must be an IPv4 address, got: $LOG_HOST"
            exit 1
          fi
          make pkg LOG_HOST="$LOG_HOST"
      - if: inputs.keep
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: own-storage-${{ github.sha }}${{ inputs.log_host != '' && '-debug' || '' }}
          # The .elf keeps the symbols the package's stripped binary drops, so a debugger's
          # addresses can be read as function names.
          path: |
            own-storage*.pkg
            own-storage.elf
          if-no-files-found: error
          retention-days: 14
