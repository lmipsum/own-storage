name: secrets-scan

# Every push, docs included: any tracked file can leak a credential.
on:
  push:
    branches: [master, dev]
  pull_request:

permissions: {}

jobs:
  secrets-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Scan tracked files for credentials
        run: git ls-files -z | xargs -0 python3 scripts/check-secrets.py
