version: 2

# Weekly grouped PRs against dev; a bump reaches main only through the normal merge.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    # The repository's commit types; scripts/check-commits.py lets these through.
    commit-message:
      prefix: "build"
    groups:
      github-actions:
        patterns: ["*"]
